name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check lint and formatting
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Run mypy
        run: uv run mypy src tests

      - name: Run pytest
        run: uv run pytest -v

      - name: Check pip install
        run: |
          python -m venv /tmp/pip-check
          /tmp/pip-check/bin/pip install -e .
          /tmp/pip-check/bin/python -c "import rattle; assert rattle.__version__"