[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rattle"
version = "0.1.0"
description = "HTTP API fuzzing service with request minimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rattle"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]